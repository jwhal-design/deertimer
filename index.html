<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opening Morning timer</title>
<style>
  :root {
    --blaze: #ff6a13;
    --blaze-hot: #ff8a3d;
    --bark: #17110c;
    --tan: #eadfc8;
    --panel: rgba(18, 14, 10, 0.8);
  }
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  body {
    font-family: "Rockwell", "Rockwell Nova", "Roboto Slab", "Bookman Old Style", Georgia, serif;
    color: var(--tan);
    -webkit-font-smoothing: antialiased;
  }
  body.idle-cursor { cursor: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #stamp {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: clamp(84px, 17vh, 210px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(0, 0, 0, 0.84);
    box-sizing: content-box;
  }
  #stampc { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: pointer; }

  #panel {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: calc(env(safe-area-inset-left, 0px) + 14px);
    max-width: calc(100vw - 28px);
    background: var(--panel);
    border-top: 5px solid var(--blaze);
    border-radius: 2px 2px 10px 10px;
    padding: 12px 14px 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    transition: opacity 0.35s ease, transform 0.35s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #panel.tucked { opacity: 0; transform: translateY(-10px); pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #panel button {
    font: inherit; font-size: 17px; line-height: 1;
    color: var(--tan);
    background: transparent;
    border: 2px solid rgba(234, 223, 200, 0.28);
    border-radius: 4px;
    padding: 9px 12px;
    cursor: pointer;
    min-width: 44px; min-height: 40px;
  }
  #panel button:hover { border-color: var(--blaze); color: #fff; }
  #panel button:focus-visible { outline: 3px solid var(--blaze-hot); outline-offset: 2px; }
  .timefield { display: flex; align-items: center; gap: 8px; margin-right: 4px; }
  .timefield span { font-size: 15px; opacity: 0.75; }
  #time {
    font: inherit; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;
    width: 5.2ch; padding: 6px 10px; min-height: 40px; box-sizing: border-box;
    color: #fff; background: rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(234, 223, 200, 0.28); border-radius: 4px; text-align: center;
  }
  #time:focus { outline: none; border-color: var(--blaze); }
  #time:focus-visible { outline: 3px solid var(--blaze-hot); outline-offset: 2px; }
  #time[aria-invalid="true"] { border-color: #ff4d4d; }
  #time:disabled { opacity: 0.45; }
  .hint.err { color: #ffb08a; opacity: 1; }
  #panel button.primary {
    background: var(--blaze); border-color: var(--blaze); color: var(--bark);
    font-weight: 700; padding: 9px 20px; min-width: 104px;
  }
  #panel button.primary:hover { background: var(--blaze-hot); border-color: var(--blaze-hot); color: var(--bark); }
  #panel button:disabled { opacity: 0.35; cursor: default; }
  #panel button:disabled:hover { border-color: rgba(234, 223, 200, 0.28); color: var(--tan); }
  .hint { margin: 10px 0 0; font-size: 13px; opacity: 0.6; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 560px) {
    #panel button { font-size: 15px; padding: 8px 10px; }
    .hint { display: none; }
    .hint.err { display: block; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div id="panel" role="toolbar" aria-label="Timer controls">
  <div class="row">
    <label class="timefield">
      <span>Time</span>
      <input id="time" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
             value="5:00" aria-describedby="hint">
    </label>
    <button id="go" class="primary">Start</button>
    <button id="reset">Reset</button>
    <button id="snd" aria-pressed="true">Sound on</button>
    <button id="fs">Full screen</button>
  </div>
  <p class="hint" id="hint">Type 5, 1:30, or 45s, then press Enter. Space starts and pauses.</p>
</div>

<div id="stamp"><canvas id="stampc" aria-hidden="true"></canvas></div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const cvs = $('#scene'), ctx = cvs.getContext('2d');
const scv = $('#stampc'), sc = scv.getContext('2d');
const panel = $('#panel'), live = $('#live');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const ramp = list => list.map(([p, h]) => [p, hex(h)]);
function K(stops, p) {
  if (p <= stops[0][0]) return stops[0][1];
  for (let i = 0; i < stops.length - 1; i++) {
    const [p0, c0] = stops[i], [p1, c1] = stops[i + 1];
    if (p <= p1) return mix(c0, c1, smooth((p - p0) / (p1 - p0)));
  }
  return stops[stops.length - 1][1];
}
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ---------- light: pre-dawn to legal light to full morning ---------- */
const SKY_T = ramp([[0,'#070b24'],[.3,'#1a2350'],[.55,'#3a5a93'],[.8,'#5f94c9'],[1,'#79afdc']]);
const SKY_M = ramp([[0,'#131a42'],[.3,'#4b3a6e'],[.55,'#c4817f'],[.8,'#e7b894'],[1,'#cfe0e6']]);
const SKY_H = ramp([[0,'#262a58'],[.3,'#c26a5a'],[.55,'#ffb36b'],[.8,'#ffd699'],[1,'#fbe9c6']]);
const RIDGE = ramp([[0,'#12142f'],[.4,'#3a2e4e'],[.7,'#6e6a80'],[1,'#8d96a2']]);
const DIST  = ramp([[0,'#0d0f25'],[.4,'#2a2136'],[.7,'#4c4a54'],[1,'#5d6858']]);
const FIELD_F = ramp([[0,'#0b0e13'],[.4,'#1c2418'],[.7,'#566c2d'],[1,'#6f8f3a']]);
const FIELD_N = ramp([[0,'#06080a'],[.4,'#121910'],[.7,'#3e5922'],[1,'#56772c']]);
const ROAD  = ramp([[0,'#140b09'],[.4,'#3a1a12'],[.7,'#8a3b22'],[1,'#a9492a']]);
const TREE  = ramp([[0,'#05060a'],[.4,'#110e11'],[.7,'#2a221b'],[1,'#3a3125']]);
const RIM   = ramp([[0,'#0a0c18'],[.4,'#3a2436'],[.7,'#b8693a'],[1,'#c98a4b']]);
const CEDAR = ramp([[0,'#040607'],[.4,'#0a110d'],[.7,'#1b291b'],[1,'#253729']]);
const DEER  = ramp([[0,'#0b0909'],[.4,'#191310'],[.7,'#4a3727'],[1,'#6d5137']]);
const SUN   = ramp([[0,'#ff7a45'],[.35,'#ff8a4c'],[.6,'#ffc46b'],[1,'#fff0c8']]);

/* ---------- scene geometry ---------- */
let W = 0, H = 0, DPR = 1, HZ = 0, GB = 0;
const G = {};
const groundY = d => HZ + d * (GB - HZ);
const scaleAt = d => H * (0.00035 + 0.00125 * d);
const farY = x => HZ - H * (0.05 + 0.022 * Math.sin(x / W * 4.3 + 0.8) + 0.011 * Math.sin(x / W * 11.7 + 2.1) + 0.005 * Math.sin(x / W * 29 + 1));

function cedar(p, x, base, h, w, R) {
  const n = 10, L = [], Rt = [];
  for (let k = 1; k <= n; k++) {
    const t = k / n, y = base - h * t, ww = (w / 2) * (1 - t * 0.92) * (0.75 + R() * 0.5);
    L.push([x - ww, y + h * 0.035], [x - ww * 0.55, y]);
    Rt.push([x + ww, y + h * 0.035], [x + ww * 0.55, y]);
  }
  p.moveTo(x - w * 0.45, base);
  L.forEach(([a, b]) => p.lineTo(a, b));
  p.lineTo(x, base - h * 1.05);
  Rt.reverse().forEach(([a, b]) => p.lineTo(a, b));
  p.lineTo(x + w * 0.45, base);
  p.closePath();
}

function crown(p, x, y, r, R) {
  p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2);
  const n = 7;
  for (let i = 0; i < n; i++) {
    const a = Math.PI * (0.9 + 1.2 * (i / n)) + (R() - 0.5) * 0.5;
    const rr = r * (0.14 + R() * 0.2), d = r * (0.92 + R() * 0.12);
    const cx = x + Math.cos(a) * d, cy = y + Math.sin(a) * d;
    p.moveTo(cx + rr, cy); p.arc(cx, cy, rr, 0, Math.PI * 2);
  }
}

function build() {
  const R = rng(20261114);
  HZ = H * 0.56; GB = H * 0.86;

  let p = new Path2D(); p.moveTo(0, H);
  for (let i = 0; i <= 140; i++) { const x = i / 140 * W; p.lineTo(x, farY(x)); }
  p.lineTo(W, H); p.closePath(); G.ridge = p;

  p = new Path2D(); p.rect(0, HZ - 1, W, H - HZ + 1);
  for (let x = -10; x < W + 20;) {
    const r = H * (0.006 + R() * 0.012);
    if (R() < 0.12) { x += r * 4; continue; }
    p.moveTo(x + r, HZ - r * 0.3); p.arc(x, HZ - r * 0.3, r, 0, Math.PI * 2);
    x += r * (0.8 + R() * 0.7);
  }
  G.distant = p;

  // west woods: where they come from
  const LX = 0.2 * W;
  p = new Path2D();
  p.rect(-10, H * 0.32, LX * 0.62, H);
  for (let i = 0; i < 190; i++) {
    const u = Math.pow(R(), 0.75);
    const x = -0.06 * W + u * (LX + 0.06 * W);
    const top = H * (0.08 + 0.36 * Math.pow(u, 1.7));
    const y = top + R() * (0.74 * H - top);
    const r = H * (0.022 + R() * 0.045) * (1 - 0.35 * u);
    if (x + r * 0.5 > LX && y > 0.5 * H) continue;
    crown(p, x, y, r, R);
  }
  for (let x = 0; x < LX + 0.02 * W; x += H * 0.012) {
    const r = H * (0.012 + R() * 0.018), y = H * (0.73 + R() * 0.05);
    p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2);
  }
  G.left = p;

  // east woods
  const RX = 0.85 * W;
  p = new Path2D();
  p.rect(RX + 0.06 * W, H * 0.36, W, H);
  for (let i = 0; i < 120; i++) {
    const u = R(), x = RX + u * 0.2 * W;
    const top = H * (0.31 - 0.12 * u), y = top + R() * (0.7 * H - top);
    const r = H * (0.02 + R() * 0.04);
    crown(p, x, y, r, R);
  }
  for (let x = RX - 0.01 * W; x < W; x += H * 0.012) {
    const r = H * (0.01 + R() * 0.016), y = H * (0.69 + R() * 0.04);
    p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2);
  }
  G.right = p;

  // red cedars, the official tree of Oklahoma pastures whether anyone wants them or not
  p = new Path2D();
  cedar(p, 0.1 * W, H * 0.79, H * 0.24, H * 0.085, R);
  cedar(p, 0.155 * W, H * 0.8, H * 0.17, H * 0.07, R);
  cedar(p, 0.875 * W, H * 0.73, H * 0.16, H * 0.06, R);
  cedar(p, 0.67 * W, HZ + H * 0.012, H * 0.035, H * 0.014, R);
  cedar(p, 0.685 * W, HZ + H * 0.014, H * 0.028, H * 0.012, R);
  G.cedars = p;

  // red dirt lease road
  p = new Path2D();
  p.moveTo(0.1 * W, H + 2);
  p.bezierCurveTo(0.34 * W, 0.8 * H, 0.46 * W, 0.64 * H, 0.598 * W, HZ + 1);
  p.lineTo(0.606 * W, HZ + 1);
  p.bezierCurveTo(0.52 * W, 0.64 * H, 0.5 * W, 0.8 * H, 0.33 * W, H + 2);
  p.closePath();
  G.road = p;

  G.stars = Array.from({ length: 170 }, () => ({
    x: R() * W, y: Math.pow(R(), 1.4) * HZ * 0.85, r: R() < 0.1 ? 2 : 1.2,
    a: 0.4 + R() * 0.6, f: 0.6 + R() * 2.2, ph: R() * 6.28
  }));

  G.wheat = Array.from({ length: 70 }, (_, i) => 0.5 * W + (i - 35) * W * 0.045);

  buildBranch(R);
  buildGrain(R);
}

function buildBranch(R) {
  const bw = Math.round(W * 0.46 * DPR), bh = Math.round(H * 0.44 * DPR);
  const raw = document.createElement('canvas'); raw.width = bw; raw.height = bh;
  const b = raw.getContext('2d');
  b.strokeStyle = b.fillStyle = '#110b07';
  b.lineCap = 'round';
  const pts = [];
  const P0 = [bw * 1.02, bh * 0.05], P1 = [bw * 0.7, bh * 0.02], P2 = [bw * 0.45, bh * 0.28], P3 = [bw * 0.16, bh * 0.42];
  const bez = t => { const m = 1 - t; return [
    m*m*m*P0[0] + 3*m*m*t*P1[0] + 3*m*t*t*P2[0] + t*t*t*P3[0],
    m*m*m*P0[1] + 3*m*m*t*P1[1] + 3*m*t*t*P2[1] + t*t*t*P3[1]]; };
  const N = 40;
  for (let i = 0; i < N; i++) {
    const a = bez(i / N), c = bez((i + 1) / N);
    b.lineWidth = lerp(bh * 0.07, bh * 0.012, i / N);
    b.beginPath(); b.moveTo(a[0], a[1]); b.lineTo(c[0], c[1]); b.stroke();
    if (i % 5 === 2) pts.push(c);
  }
  pts.push(bez(1));
  const leaf = (x, y, s, rot) => {
    b.save(); b.translate(x, y); b.rotate(rot); b.beginPath();
    b.moveTo(0, 0);
    b.bezierCurveTo(s * .5, s * .15, s * .55, s * .5, s * .3, s * .62);
    b.bezierCurveTo(s * .6, s * .75, s * .45, s * 1.05, 0, s * 1.15);
    b.bezierCurveTo(-s * .45, s * 1.05, -s * .6, s * .75, -s * .3, s * .62);
    b.bezierCurveTo(-s * .55, s * .5, -s * .5, s * .15, 0, 0);
    b.fill(); b.restore();
  };
  pts.forEach(([x, y], k) => {
    const twigs = 2 + (R() * 2 | 0);
    for (let j = 0; j < twigs; j++) {
      const ang = Math.PI * (0.35 + R() * 0.5) + (R() - .5) * 0.4;
      const len = bh * (0.08 + R() * 0.14);
      const ex = x + Math.cos(ang) * len * (R() < .5 ? -1 : 1) * 0.6, ey = y + Math.sin(ang) * len;
      b.lineWidth = bh * 0.008; b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(x, (y + ey) / 2, ex, ey); b.stroke();
      const leaves = 3 + (R() * 3 | 0);
      for (let q = 0; q < leaves; q++) {
        b.globalAlpha = 0.8 + R() * 0.2;
        leaf(ex + (R() - .5) * bh * .05, ey + (R() - .5) * bh * .04, bh * (0.05 + R() * 0.035), (R() - .5) * 1.4);
      }
      b.globalAlpha = 1;
    }
  });
  const out = document.createElement('canvas'); out.width = bw; out.height = bh;
  const o = out.getContext('2d');
  o.filter = `blur(${Math.max(2, 3 * DPR)}px)`;
  o.drawImage(raw, 0, 0);
  G.branch = out;
}

function buildGrain(R) {
  const g = document.createElement('canvas'); g.width = g.height = 180;
  const x = g.getContext('2d'), img = x.createImageData(180, 180);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = R() * 255 | 0; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  G.grain = ctx.createPattern(g, 'repeat');
}

/* ---------- deer ---------- */
const herd = [];
const puffs = [];

class Deer {
  constructor(o) {
    Object.assign(this, { x: o.x, d: o.d, tx: o.tx, td: o.td ?? o.d, after: o.after || 'graze',
      size: o.size || 1, buck: !!o.buck, face: 1, phase: Math.random() * 6, head: 0.12, headT: 0.12,
      tail: 0, tailT: 0, state: 'walk', timer: 0, next: 0, amp: 0, puff: 1 + Math.random() * 2,
      nose: null, speed: o.speed || 1, look: 1, flick: 0 });
  }
  goto(tx, td, after, speed) { this.tx = tx; this.td = td ?? this.d; this.after = after; this.state = 'walk'; if (speed) this.speed = speed; }
  update(dt, p) {
    const s = scaleAt(this.d) * this.size;
    if (this.state === 'walk') {
      const dx = (this.tx - this.x) * W, dy = (this.td - this.d) * (GB - HZ), dist = Math.hypot(dx, dy);
      if (dist < 1.5) { this.state = this.after; this.timer = 0; this.next = 0; }
      else {
        const step = Math.min(dist, W * 0.028 * this.speed * dt);
        this.x += dx / dist * step / W; this.d += dy / dist * step / (GB - HZ);
        if (Math.abs(dx) > 0.5) this.face = dx > 0 ? 1 : -1;
        this.phase += step / (s * 64) * Math.PI * 2;
        this.headT = this.buck ? 0 : 0.12;
      }
    }
    this.amp += ((this.state === 'walk' ? 1 : 0) - this.amp) * Math.min(1, dt * 5);
    this.timer += dt;

    if (this.state === 'graze' && this.timer > this.next) {
      this.timer = 0;
      if (this.headT > 0.5) { this.headT = 0; this.next = 1.5 + Math.random() * 2.5; }
      else if (Math.random() < 0.25) { this.goto(clamp(this.x + (Math.random() - 0.35) * 0.05, 0.25, 0.7), this.d, 'graze', 0.5); }
      else { this.headT = 1; this.next = 4 + Math.random() * 6; }
      if (Math.random() < 0.3) this.flick = 0.35;
    }
    if (this.state === 'alert') {
      this.headT = 0; this.face = this.look;
      if (this.timer > this.next) { this.timer = 0; this.next = 1.2 + Math.random() * 2.2; this.flick = 0.55; }
    }
    if (this.state === 'stand') { this.headT = 0; if (this.look) this.face = this.look; }

    this.flick = Math.max(0, this.flick - dt);
    this.tailT = this.flick > 0 ? (this.state === 'alert' ? 1 : 0.45) : 0;
    this.head += (this.headT - this.head) * Math.min(1, dt * 2.2);
    this.tail += (this.tailT - this.tail) * Math.min(1, dt * 12);

    if (p < 0.62 && this.head < 0.4 && this.nose && !reduceMotion) {
      this.puff -= dt;
      if (this.puff <= 0) {
        puffs.push({ x: this.nose[0], y: this.nose[1], r: s * 3, s, a: 0.32 * (1 - p), vx: this.face * s * 7 });
        this.puff = 2.4 + Math.random() * 1.8;
      }
    }
  }
}

function deerShape(dr, col, rimCol, rimA) {
  const c = ctx, a = dr.amp, ph = dr.phase;
  const dark = mix(col, [0, 0, 0], 0.35);
  c.lineCap = 'round'; c.lineJoin = 'round';

  const front = (ox, off, shade) => {
    const sw = Math.sin(ph + off) * 0.45 * a, bend = Math.max(0, Math.cos(ph + off)) * 0.95 * a;
    const kx = ox + Math.sin(sw) * 30, ky = -64 + Math.cos(sw) * 30;
    const a2 = sw - bend, fx = kx + Math.sin(a2) * 34, fy = ky + Math.cos(a2) * 34;
    c.strokeStyle = rgb(shade);
    c.lineWidth = 9; c.beginPath(); c.moveTo(ox, -66); c.lineTo(kx, ky); c.stroke();
    c.lineWidth = 4.2; c.beginPath(); c.moveTo(kx, ky); c.lineTo(fx, fy); c.stroke();
  };
  const hind = (ox, off, shade) => {
    const sw = Math.sin(ph + off) * 0.4 * a, lift = Math.max(0, Math.cos(ph + off)) * a;
    const a1 = 0.45 + sw, a2 = -0.6 + sw - lift * 0.25, a3 = 0.04 + sw + lift * 0.7;
    const kx = ox + Math.sin(a1) * 24, ky = -66 + Math.cos(a1) * 24;
    const hx = kx + Math.sin(a2) * 23, hy = ky + Math.cos(a2) * 23;
    const fx = hx + Math.sin(a3) * 24, fy = hy + Math.cos(a3) * 24;
    c.strokeStyle = rgb(shade);
    c.lineWidth = 13; c.beginPath(); c.moveTo(ox, -70); c.lineTo(kx, ky); c.stroke();
    c.lineWidth = 6; c.beginPath(); c.moveTo(kx, ky); c.lineTo(hx, hy); c.stroke();
    c.lineWidth = 4.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
  };

  front(30, Math.PI, dark); hind(-34, Math.PI * 0.5, dark);

  // tail (whitetail flag goes up when they're nervous)
  const tAng = lerp(2.5, -0.5, dr.tail), tl = lerp(12, 17, dr.tail);
  c.save(); c.translate(-49, -70); c.rotate(tAng);
  c.fillStyle = rgb(mix(col, [244, 239, 228], dr.tail * 0.95));
  c.beginPath(); c.ellipse(tl / 2, 0, tl / 2, lerp(3.5, 6, dr.tail), 0, 0, Math.PI * 2); c.fill();
  c.restore();

  // body
  const body = new Path2D();
  body.moveTo(-50, -64);
  body.bezierCurveTo(-53, -77, -40, -81, -22, -78);
  body.bezierCurveTo(0, -75, 14, -80, 26, -82);
  body.bezierCurveTo(40, -80, 51, -70, 49, -58);
  body.bezierCurveTo(47, -48, 37, -44, 26, -44);
  body.bezierCurveTo(8, -40, -18, -43, -34, -46);
  body.bezierCurveTo(-44, -48, -50, -54, -50, -64);
  c.fillStyle = rgb(col); c.fill(body);

  // neck and head
  const h = dr.head;
  const hp = [lerp(66, 76, h), lerp(-114, -12, h)], ang = lerp(0.55, 1.6, h);
  const cs = Math.cos(ang), sn = Math.sin(ang);
  const T = (x, y) => [hp[0] + x * cs - y * sn, hp[1] + x * sn + y * cs];
  const nb = dr.buck ? 5 : 0;
  const top = T(-6, -9), thr = T(4, 9);
  const c1 = [lerp(40, 62, h), lerp(-104, -72, h)], c2 = [lerp(58 + nb, 64, h), lerp(-84, -40, h)];
  c.beginPath();
  c.moveTo(12, -81);
  c.quadraticCurveTo(c1[0], c1[1], top[0], top[1]);
  c.lineTo(thr[0], thr[1]);
  c.quadraticCurveTo(c2[0], c2[1], 49 + nb, -53 + nb);
  c.closePath(); c.fill();

  c.save(); c.translate(hp[0], hp[1]); c.rotate(ang);
  // far ear
  c.fillStyle = rgb(dark);
  c.beginPath(); c.moveTo(-6, -5); c.quadraticCurveTo(-20, -10, -21, -20); c.quadraticCurveTo(-10, -16, -2, -7); c.fill();
  // head
  c.fillStyle = rgb(col);
  c.beginPath();
  c.moveTo(-7, -8);
  c.bezierCurveTo(4, -10, 16, -6, 24, -2.5);
  c.quadraticCurveTo(28, 0, 24, 3);
  c.bezierCurveTo(14, 6, 4, 9, -6, 8.5);
  c.quadraticCurveTo(-12, 0, -7, -8);
  c.fill();
  // near ear
  c.beginPath(); c.moveTo(-3, -6); c.quadraticCurveTo(-10, -20, -6, -27); c.quadraticCurveTo(1, -18, 2, -7); c.fill();

  if (dr.buck) {
    const beam = (ox, oy, shade, lw) => {
      c.strokeStyle = rgb(shade);
      const B = [[ox - 3, oy - 7], [ox - 22, oy - 22], [ox - 12, oy - 50], [ox + 16, oy - 50]];
      const at = t => { const m = 1 - t; return [
        m*m*m*B[0][0] + 3*m*m*t*B[1][0] + 3*m*t*t*B[2][0] + t*t*t*B[3][0],
        m*m*m*B[0][1] + 3*m*m*t*B[1][1] + 3*m*t*t*B[2][1] + t*t*t*B[3][1]]; };
      c.lineWidth = lw; c.beginPath(); c.moveTo(...B[0]); c.bezierCurveTo(...B[1], ...B[2], ...B[3]); c.stroke();
      c.lineWidth = lw * 0.7;
      [[0.12, -3, -9], [0.42, 6, -17], [0.62, 10, -19], [0.82, 10, -14], [0.96, 6, -8]].forEach(([t, dx, dy]) => {
        const q = at(t); c.beginPath(); c.moveTo(q[0], q[1]); c.quadraticCurveTo(q[0] + dx * 0.2, q[1] + dy * 0.7, q[0] + dx, q[1] + dy); c.stroke();
      });
    };
    beam(3, -2, dark, 3.2);
    beam(0, 0, mix(col, [210, 190, 160], 0.35), 3.6);
  }
  c.restore();

  front(26, 0, col); hind(-30, Math.PI * 1.5, col);

  if (rimA > 0.01) {
    c.save(); c.clip(body);
    c.strokeStyle = rgb(rimCol, rimA * 0.55); c.lineWidth = 5;
    c.beginPath(); c.moveTo(-46, -78); c.bezierCurveTo(-30, -80, 0, -75, 26, -82); c.bezierCurveTo(40, -80, 51, -70, 49, -58); c.stroke();
    c.restore();
  }
  const n = T(26, 0);
  return n;
}

function drawDeer(dr, col, rimCol, rimA, shadowA) {
  const s = scaleAt(dr.d) * dr.size, x = dr.x * W, y = groundY(dr.d);
  if (shadowA > 0.01) {
    ctx.fillStyle = `rgba(20,14,10,${shadowA})`;
    ctx.beginPath(); ctx.ellipse(x - s * 30, y + s * 2, s * 70, s * 6, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save(); ctx.translate(x, y); ctx.scale(s * dr.face, s);
  const n = deerShape(dr, col, rimCol, rimA);
  ctx.restore();
  dr.nose = [x + n[0] * s * dr.face, y + n[1] * s];
}

/* ---------- small set pieces ---------- */
function pumpjack(t, col) {
  const x = W * 0.775, base = farY(x) + H * 0.004, k = H * 0.032;
  const c = ctx; c.save(); c.translate(x, base);
  c.strokeStyle = c.fillStyle = rgb(col);
  c.lineCap = 'round'; c.lineWidth = Math.max(1.2, k * 0.08);
  c.beginPath(); c.moveTo(-k * 1.3, 0); c.lineTo(k * 1.2, 0); c.stroke();
  c.beginPath(); c.moveTo(-k * 0.35, 0); c.lineTo(0, -k); c.lineTo(k * 0.35, 0); c.stroke();
  const a = Math.sin(t * Math.PI * 2 / 5.5) * 0.22;
  c.translate(0, -k); c.rotate(a);
  c.lineWidth = Math.max(1.6, k * 0.12);
  c.beginPath(); c.moveTo(-k * 0.9, 0); c.lineTo(k * 0.95, 0); c.stroke();
  c.beginPath(); c.moveTo(k * 0.95, -k * 0.12); c.quadraticCurveTo(k * 1.35, k * 0.05, k * 1.0, k * 0.38); c.lineTo(k * 0.9, 0); c.fill();
  c.lineWidth = Math.max(1, k * 0.05);
  c.beginPath(); c.moveTo(k * 1.05, k * 0.38); c.lineTo(k * 1.05, k * (1 + a * 1.6)); c.stroke();
  c.beginPath(); c.arc(-k * 0.85, k * 0.25, k * 0.22, 0, Math.PI * 2); c.fill();
  c.restore();
}

function feeder(col) {
  const d = 0.26, x = W * 0.47, y = groundY(d), s = scaleAt(d);
  const c = ctx; c.save(); c.translate(x, y); c.scale(s, s);
  c.strokeStyle = c.fillStyle = rgb(col); c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-26, 0); c.lineTo(0, -88); c.lineTo(26, 0); c.moveTo(0, -88); c.lineTo(4, 2); c.stroke();
  c.fillRect(-11, -126, 22, 36);
  c.beginPath(); c.moveTo(-14, -126); c.lineTo(0, -136); c.lineTo(14, -126); c.fill();
  c.restore();
}

let geese = null;
function drawGeese(t, col) {
  if (!geese) return;
  const g = geese, age = t - g.t0, dur = 16;
  if (age > dur) { geese = null; return; }
  const u = age / dur, cx = lerp(W * 1.08, -W * 0.1, u), cy = H * 0.2 + Math.sin(u * 3) * H * 0.015;
  const k = H * 0.011;
  ctx.strokeStyle = rgb(col, 0.8); ctx.lineWidth = Math.max(1.2, k * 0.25); ctx.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const side = i === 0 ? 0 : (i % 2 ? 1 : -1), rank = Math.ceil(i / 2);
    const bx = cx + rank * k * 3.2, by = cy + side * rank * k * 1.9;
    const f = Math.sin(t * 6 + i * 0.8) * k * 0.7;
    ctx.beginPath(); ctx.moveTo(bx - k * 1.1, by - f); ctx.quadraticCurveTo(bx - k * 0.4, by - f * 0.2, bx, by); ctx.quadraticCurveTo(bx + k * 0.4, by - f * 0.2, bx + k * 1.1, by - f); ctx.stroke();
  }
}

function fog(t, p, y0, y1, n, speed, alpha, col) {
  if (alpha <= 0.005) return;
  const c = ctx;
  for (let i = 0; i < n; i++) {
    const cx = ((i / n) * 1.6 * W + t * speed * W * (i % 2 ? 1 : 0.7)) % (1.6 * W) - 0.3 * W;
    const cy = lerp(y0, y1, (i * 0.37) % 1), rx = W * (0.22 + (i % 3) * 0.06), ry = (y1 - y0) * 0.9 + H * 0.02;
    c.save(); c.translate(cx, cy); c.scale(1, ry / rx);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, rgb(col, alpha)); g.addColorStop(1, rgb(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, Math.PI * 2); c.fill();
    c.restore();
  }
}

function woods(path, base, rim, rimAmt) {
  const c = ctx;
  if (rimAmt < 0.02) { c.fillStyle = rgb(base); c.fill(path); return; }
  c.save(); c.clip(path);
  c.fillStyle = rgb(mix(rim, base, 0.35)); c.fillRect(0, 0, W, H);
  const k = H * 0.0045 * rimAmt;
  c.translate(-k, k * 0.8); c.fillStyle = rgb(base); c.fill(path);
  c.restore();
}

/* ---------- the whole morning ---------- */
let flash = 0;
function draw(p, t) {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);

  let g = c.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, rgb(K(SKY_T, p))); g.addColorStop(0.6, rgb(K(SKY_M, p))); g.addColorStop(1, rgb(K(SKY_H, p)));
  c.fillStyle = g; c.fillRect(0, 0, W, HZ + 2);

  const sa = 1 - smooth(clamp(p / 0.34, 0, 1));
  if (sa > 0.01) for (const s of G.stars) {
    const tw = reduceMotion ? 1 : 0.6 + 0.4 * Math.sin(t * s.f + s.ph);
    c.fillStyle = `rgba(255,247,228,${sa * tw * s.a})`; c.fillRect(s.x, s.y, s.r, s.r);
  }

  const sp = smooth(clamp((p - 0.28) / 0.72, 0, 1));
  const sunX = W * 0.66, sunY = HZ + H * 0.04 - H * 0.3 * sp, sunC = K(SUN, p);
  const glow = clamp((p - 0.16) / 0.3, 0, 1);
  if (glow > 0) {
    g = c.createRadialGradient(sunX, sunY, 0, sunX, sunY, H * 0.6);
    g.addColorStop(0, rgb(sunC, 0.6 * glow)); g.addColorStop(0.22, rgb(sunC, 0.2 * glow)); g.addColorStop(1, rgb(sunC, 0));
    c.fillStyle = g; c.fillRect(0, 0, W, HZ + 2);
    c.fillStyle = rgb(mix(sunC, [255, 255, 255], 0.55), glow);
    c.beginPath(); c.arc(sunX, sunY, H * 0.027, 0, Math.PI * 2); c.fill();
  }

  const treeC = K(TREE, p);
  drawGeese(t, mix(treeC, [0, 0, 0], 0.3));

  const ridgeC = K(RIDGE, p);
  c.fillStyle = rgb(ridgeC); c.fill(G.ridge);
  pumpjack(t, mix(ridgeC, [10, 10, 20], 0.45));
  c.fillStyle = rgb(K(DIST, p)); c.fill(G.distant);

  g = c.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, rgb(K(FIELD_F, p))); g.addColorStop(1, rgb(K(FIELD_N, p)));
  c.fillStyle = g; c.fillRect(0, HZ, W, H - HZ);

  if (glow > 0) {
    c.save(); c.translate(sunX, HZ); c.scale(1, 0.22);
    g = c.createRadialGradient(0, 0, 0, 0, 0, W * 0.5);
    g.addColorStop(0, rgb(sunC, 0.28 * glow)); g.addColorStop(1, rgb(sunC, 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, W * 0.5, 0, Math.PI * 2); c.fill(); c.restore();
  }

  c.save(); c.beginPath(); c.rect(0, HZ + 1, W, H); c.clip();
  c.strokeStyle = `rgba(0,0,0,${0.12 + 0.06 * p})`; c.lineWidth = 1;
  for (const bx of G.wheat) { c.beginPath(); c.moveTo(0.5 * W, HZ); c.lineTo(bx, H); c.stroke(); }
  c.restore();

  const roadC = K(ROAD, p);
  g = c.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, rgb(mix(roadC, K(SKY_H, p), 0.35))); g.addColorStop(1, rgb(roadC));
  c.fillStyle = g; c.fill(G.road);

  const hazeC = mix(K(SKY_H, p), [235, 238, 245], 0.45);
  fog(t, p, HZ - H * 0.01, HZ + H * 0.05, 6, 0.004, 0.55 * (1 - smooth(clamp(p / 0.75, 0, 1))), hazeC);

  feeder(mix(K(DEER, p), [0, 0, 0], 0.3));

  const deerC = K(DEER, p), rimC = mix(sunC, [255, 255, 255], 0.2);
  const rimA = clamp((p - 0.45) / 0.4, 0, 1) * 0.6, shA = clamp((p - 0.55) / 0.35, 0, 1) * 0.28;
  herd.slice().sort((a, b) => a.d - b.d).forEach(d => drawDeer(d, deerC, rimC, rimA, shA));

  for (const f of puffs) {
    g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    g.addColorStop(0, `rgba(240,240,245,${f.a})`); g.addColorStop(1, 'rgba(240,240,245,0)');
    c.fillStyle = g; c.beginPath(); c.arc(f.x, f.y, f.r, 0, Math.PI * 2); c.fill();
  }

  const rimAmt = clamp((p - 0.35) / 0.45, 0, 1);
  woods(G.left, treeC, K(RIM, p), rimAmt * 0.5);
  woods(G.right, treeC, K(RIM, p), rimAmt);
  woods(G.cedars, K(CEDAR, p), K(RIM, p), rimAmt * 0.7);

  fog(t + 40, p, H * 0.68, H * 0.8, 5, 0.006, 0.28 * (1 - smooth(clamp(p / 0.6, 0, 1))), hazeC);

  if (p > 0.5) {
    const ra = clamp((p - 0.5) / 0.3, 0, 1) * 0.035;
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 6; i++) {
      const a0 = Math.PI * (0.62 + i * 0.07) + Math.sin(t * 0.1 + i) * 0.01, spread = 0.025;
      c.fillStyle = rgb(sunC, ra * (0.5 + (i % 2) * 0.5));
      c.beginPath(); c.moveTo(sunX, sunY);
      c.lineTo(sunX + Math.cos(a0 - spread) * W, sunY + Math.sin(a0 - spread) * W);
      c.lineTo(sunX + Math.cos(a0 + spread) * W, sunY + Math.sin(a0 + spread) * W);
      c.fill();
    }
    c.restore();
  }

  // looking out from the stand
  const bw = G.branch.width / DPR, bh = G.branch.height / DPR;
  c.save(); c.translate(W, 0); c.rotate(reduceMotion ? 0 : Math.sin(t * 0.55) * 0.012 + Math.sin(t * 1.3) * 0.004);
  c.globalAlpha = lerp(0.95, 0.85, p);
  c.drawImage(G.branch, -bw, 0, bw, bh); c.restore();

  c.save(); c.globalAlpha = 0.05; c.fillStyle = G.grain;
  const ox = (Math.random() * 180) | 0, oy = (Math.random() * 180) | 0;
  c.translate(-ox, -oy); c.fillRect(ox, oy, W + 180, H + 180); c.restore();

  g = c.createRadialGradient(W / 2, H * 0.45, H * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${lerp(0.55, 0.3, p)})`);
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  if (flash > 0) { c.fillStyle = `rgba(255,255,255,${flash})`; c.fillRect(0, 0, W, H); }
}

/* ---------- trail cam stamp, hand-built pixel font ---------- */
const FONT = {};
Object.entries({
  '0':'01110 10001 10011 10101 11001 10001 01110','1':'00100 01100 00100 00100 00100 00100 01110',
  '2':'01110 10001 00001 00010 00100 01000 11111','3':'11111 00010 00100 00010 00001 10001 01110',
  '4':'00010 00110 01010 10010 11111 00010 00010','5':'11111 10000 11110 00001 00001 10001 01110',
  '6':'00110 01000 10000 11110 10001 10001 01110','7':'11111 00001 00010 00100 01000 01000 01000',
  '8':'01110 10001 10001 01110 10001 10001 01110','9':'01110 10001 10001 01111 00001 00010 01100',
  ':':'00000 01100 01100 00000 01100 01100 00000','/':'00001 00010 00010 00100 01000 01000 10000',
  '°':'01100 10010 10010 01100 00000 00000 00000',"'":'00100 00100 01000 00000 00000 00000 00000',
  ' ':'00000 00000 00000 00000 00000 00000 00000','-':'00000 00000 00000 11111 00000 00000 00000',
  'A':'01110 10001 10001 11111 10001 10001 10001','B':'11110 10001 10001 11110 10001 10001 11110',
  'C':'01110 10001 10000 10000 10000 10001 01110','D':'11100 10010 10001 10001 10001 10010 11100',
  'E':'11111 10000 10000 11110 10000 10000 11111','F':'11111 10000 10000 11110 10000 10000 10000',
  'I':'01110 00100 00100 00100 00100 00100 01110','J':'00111 00010 00010 00010 00010 10010 01100',
  'K':'10001 10010 10100 11000 10100 10010 10001','L':'10000 10000 10000 10000 10000 10000 11111',
  'M':'10001 11011 10101 10101 10001 10001 10001','P':'11110 10001 10001 11110 10000 10000 10000',
  'S':'01111 10000 10000 01110 00001 00001 11110','T':'11111 00100 00100 00100 00100 00100 00100',
  'U':'10001 10001 10001 10001 10001 10001 01110','O':'01110 10001 10001 10001 10001 10001 01110'
}).forEach(([k, v]) => FONT[k] = v.split(' '));

const textW = s => s.length * 6 - 1;
function pix(str, x, y, ps, color) {
  sc.fillStyle = color;
  for (let i = 0; i < str.length; i++) {
    const gl = FONT[str[i]] || FONT[' '];
    for (let r = 0; r < 7; r++) for (let q = 0; q < 5; q++)
      if (gl[r][q] === '1') sc.fillRect(x + (i * 6 + q) * ps, y + r * ps, ps, ps);
  }
}
function moonPhase(now) {
  const days = (now - Date.UTC(2000, 0, 6, 18, 14)) / 86400000;
  return ((days / 29.530588853) % 1 + 1) % 1;
}
function moon(x, y, ps, f) {
  const n = 9, xt = Math.cos(f * Math.PI * 2);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n * 2 - 1, v = (j + 0.5) / n * 2 - 1;
    if (u * u + v * v > 1) continue;
    const w = Math.sqrt(1 - v * v);
    const lit = f < 0.5 ? u > xt * w : u < -xt * w;
    sc.fillStyle = lit ? '#f3f3ee' : '#3d3d3d';
    sc.fillRect(x + i * ps, y + j * ps, ps, ps);
  }
}
const pad = n => String(n).padStart(2, '0');
const mmss = ms => { const s = Math.ceil(ms / 1000); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };

function drawStamp(p, t) {
  const bw = scv.width, bh = scv.height;
  sc.clearRect(0, 0, bw, bh);
  let big = mmss(state === 'idle' ? total : remaining), col = '#f4f4ef', show = true;
  if (state === 'running' && remaining <= lastStretch()) col = '#ff6a13';
  if (state === 'paused') show = Math.floor(t * 1.6) % 2 === 0;
  if (state === 'done') { big = Math.floor(t / 1.4) % 2 ? '00:00' : "TIME'S UP"; col = '#ff6a13'; }
  const cols = textW(big);
  const ps = Math.max(2, Math.floor(Math.min(bh * 0.64 / 7, bw * 0.54 / cols)));
  const bx = Math.round((bw - cols * ps) / 2), by = Math.round((bh - 7 * ps) / 2);
  if (show) pix(big, bx, by, ps, col);

  const now = new Date();
  const margin = Math.round(bh * 0.14);
  let sp = Math.floor(bh * 0.5 / 18);
  const need = 59;
  if ((bx - margin * 2) < need * sp) sp = Math.floor((bx - margin * 2) / need);
  if (sp >= 2) {
    const gy1 = Math.round(bh / 2 - 9 * sp), gy2 = gy1 + 11 * sp;
    const temp = `${Math.round(34 + 13 * p)}°F`;
    pix('BLACKJACK', margin, gy1, sp, '#9a9a94');
    moon(margin, gy2 - sp, sp, moonPhase(now.getTime()));
    pix(temp, margin + 12 * sp, gy2, sp, '#f4f4ef');
    const date = `${pad(now.getMonth() + 1)}/${pad(now.getDate())}/${now.getFullYear()}`;
    const hr = now.getHours() % 12 || 12, ap = now.getHours() < 12 ? 'AM' : 'PM';
    const clock = `${pad(hr)}:${pad(now.getMinutes())} ${ap}`;
    pix(date, bw - margin - textW(date) * sp, gy1, sp, '#f4f4ef');
    pix(clock, bw - margin - textW(clock) * sp, gy2, sp, '#f4f4ef');
  }
}

/* ---------- timer ---------- */
let state = 'idle', total = 5 * 60000, remaining = total, endAt = 0, P = 0;
let flags = {};
const lastStretch = () => Math.min(60000, total * 0.2);

function resetScene() { herd.length = 0; puffs.length = 0; flags = {}; geese = null; P = 0; }
const timeIn = $('#time'), hint = $('#hint');
const HINT = hint.textContent;
const fmt = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
function parseTime(str) {
  const v = str.trim().toLowerCase().replace(/\s+/g, '');
  let m;
  if ((m = v.match(/^(\d{1,2}):(\d{1,2})$/))) return +m[2] > 59 ? null : (+m[1] * 60 + +m[2]) * 1000;
  if ((m = v.match(/^(\d+)m(?:in)?(\d+)s?(?:ec)?$/))) return +m[2] > 59 ? null : (+m[1] * 60 + +m[2]) * 1000;
  if ((m = v.match(/^(\d+)(?:s|sec|secs|seconds?)$/))) return +m[1] * 1000;
  if ((m = v.match(/^(\d+(?:\.\d+)?)(?:m|min|mins|minutes?)?$/))) return Math.round(+m[1] * 60) * 1000;
  return null;
}
function showError(msg) {
  timeIn.setAttribute('aria-invalid', String(!!msg));
  hint.textContent = msg || HINT; hint.classList.toggle('err', !!msg);
  if (msg) say(msg);
}
function setTotal(ms) {
  total = clamp(Math.round(ms / 1000) * 1000, 15000, 90 * 60000);
  remaining = total; state = 'idle'; resetScene(); wake(false);
  timeIn.value = fmt(total); showError('');
  sync(); say(`Set to ${fmt(total)}`);
}
function commitTime() {
  const ms = parseTime(timeIn.value);
  if (ms === null) { showError('Try 5, 1:30, or 45s.'); return false; }
  if (ms < 15000 || ms > 90 * 60000) { showError('Pick a time from 0:15 to 90:00.'); return false; }
  if (ms !== total || state !== 'idle') setTotal(ms); else { timeIn.value = fmt(total); showError(''); }
  return true;
}
function start() {
  if (document.activeElement === timeIn || timeIn.getAttribute('aria-invalid') === 'true') { if (!commitTime()) return; }
  if (state === 'done') { remaining = total; resetScene(); }
  endAt = performance.now() + remaining; state = 'running'; audioInit(); wake(true); sync();
  showPanel(true);
  say(`Timer started, ${mmss(remaining)}`);
}
function pause() { remaining = Math.max(0, endAt - performance.now()); state = 'paused'; wake(false); sync(); say('Paused'); }
function reset() { remaining = total; state = 'idle'; resetScene(); wake(false); sync(); say('Reset'); }
function finish() {
  state = 'done'; remaining = 0; P = 1; wake(false); sync();
  if (!reduceMotion) flash = 0.9;
  grunts(); say("Time's up");
  const b = herd.find(d => d.buck);
  if (b) b.goto(0.5, 0.66, 'stand', 0.7);
  setTimeout(() => herd.forEach(d => { if (!d.buck && d.state === 'alert') { d.state = 'graze'; d.next = 0; } }), 6000);
}

function pace(from, to) { return clamp(Math.abs(to - from) / (0.028 * (total / 1000) * 0.2), 1, 4); }
function script(p, t) {
  if (p >= 0.28 && !flags.a) { flags.a = 1; herd.push(new Deer({ x: -0.03, d: 0.58, tx: 0.4, speed: pace(-0.03, 0.4) })); }
  if (p >= 0.42 && !flags.g) { flags.g = 1; geese = { t0: t }; }
  if (p >= 0.5 && !flags.b) { flags.b = 1; herd.push(new Deer({ x: -0.04, d: 0.47, tx: 0.31, size: 0.78, speed: pace(-0.04, 0.31) })); }
  if (p >= 0.64 && !flags.c) { flags.c = 1; herd.push(new Deer({ x: -0.04, d: 0.68, tx: 0.55, speed: pace(-0.04, 0.55) })); }
  if (state === 'running' && remaining <= lastStretch() && !flags.alert) {
    flags.alert = 1;
    herd.forEach(d => { if (!d.buck) { d.after = 'alert'; if (d.state !== 'walk') { d.state = 'alert'; d.timer = 0; d.next = 0; } d.look = -1; } });
  }
  if (p >= 0.86 && !flags.buck) {
    flags.buck = 1;
    const b = new Deer({ x: 0.05, d: 0.62, tx: 0.215, buck: true, after: 'stand', speed: Math.max(0.55, pace(0.05, 0.215) * 0.6) });
    b.look = 1; herd.push(b);
  }
}

/* ---------- sound: a synthesized grunt call ---------- */
let ac = null, soundOn = true;
function audioInit() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function grunt(when) {
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  const lfo = ac.createOscillator(), lg = ac.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(125, when); o.frequency.exponentialRampToValueAtTime(74, when + 0.3);
  f.type = 'lowpass'; f.frequency.value = 650; f.Q.value = 5;
  g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(0.45, when + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, when + 0.34);
  lfo.type = 'square'; lfo.frequency.value = 27; lg.gain.value = 0.18; lfo.connect(lg).connect(g.gain);
  o.connect(f).connect(g).connect(ac.destination);
  o.start(when); o.stop(when + 0.38); lfo.start(when); lfo.stop(when + 0.38);
}
function grunts() { if (!soundOn || !ac) return; const t0 = ac.currentTime + 0.05; [0, 0.55, 1.1].forEach(d => grunt(t0 + d)); }

let lock = null;
async function wake(on) {
  try { if (on && 'wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); else if (!on && lock) { await lock.release(); lock = null; } } catch (e) {}
}

/* ---------- controls ---------- */
const go = $('#go');
function sync() {
  go.textContent = { idle: 'Start', running: 'Pause', paused: 'Resume', done: 'Start again' }[state];
  const lockSet = state === 'running';
  timeIn.disabled = lockSet;
  if (state !== 'running') showPanel(true);
}
function say(m) { live.textContent = m; }
function toggle() { state === 'running' ? pause() : start(); }

timeIn.addEventListener('change', commitTime);
timeIn.addEventListener('focus', () => timeIn.select());
timeIn.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') { e.preventDefault(); if (commitTime()) go.focus(); }
  else if (e.key === 'Escape') { timeIn.value = fmt(total); showError(''); timeIn.blur(); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const base = parseTime(timeIn.value) ?? total, step = e.shiftKey ? 15000 : 60000;
    setTotal(base + (e.key === 'ArrowUp' ? step : -step)); timeIn.select();
  }
});
go.addEventListener('click', toggle);
$('#reset').addEventListener('click', reset);
scv.addEventListener('click', toggle);
const snd = $('#snd');
snd.addEventListener('click', () => { soundOn = !soundOn; snd.setAttribute('aria-pressed', String(soundOn)); snd.textContent = soundOn ? 'Sound on' : 'Sound off'; if (soundOn) { audioInit(); grunt(ac ? ac.currentTime + 0.05 : 0); } });
const fsBtn = $('#fs');
function toggleFS() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
fsBtn.addEventListener('click', toggleFS);
document.addEventListener('fullscreenchange', () => { fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
if (!document.documentElement.requestFullscreen) fsBtn.hidden = true;

document.addEventListener('keydown', e => {
  showPanel(true);
  if (e.target === timeIn) return;
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === 'f' || e.key === 'F') toggleFS();
  else if (e.key === 'm' || e.key === 'M') snd.click();
  else if (e.key === 't' || e.key === 'T') { total = 20000; remaining = total; state = 'idle'; resetScene(); start(); }
  else if (state !== 'running' && (e.key === 'ArrowUp' || e.key === 'ArrowRight')) { e.preventDefault(); setTotal(total + (e.shiftKey ? 15000 : 60000)); }
  else if (state !== 'running' && (e.key === 'ArrowDown' || e.key === 'ArrowLeft')) { e.preventDefault(); setTotal(total - (e.shiftKey ? 15000 : 60000)); }
});

let idleTimer = 0;
function showPanel(on) {
  panel.classList.toggle('tucked', !on); document.body.classList.remove('idle-cursor');
  clearTimeout(idleTimer);
  if (on && state === 'running') idleTimer = setTimeout(() => {
    if (state === 'running' && !panel.matches(':hover') && !panel.contains(document.activeElement)) { panel.classList.add('tucked'); document.body.classList.add('idle-cursor'); }
  }, 3000);
}
['pointermove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, () => showPanel(true), { passive: true }));

/* ---------- loop ---------- */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  scv.width = Math.round(scv.clientWidth * DPR); scv.height = Math.round(scv.clientHeight * DPR);
  build();
}
addEventListener('resize', resize);
resize();

let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (state === 'running') {
    remaining = Math.max(0, endAt - now);
    P = 1 - remaining / total;
    if (remaining <= 0) finish();
  }
  if (state === 'running' || state === 'done') script(P, T);
  if (state !== 'paused') herd.forEach(d => d.update(dt, P));
  for (let i = puffs.length - 1; i >= 0; i--) {
    const f = puffs[i]; f.r += dt * f.s * 16; f.a -= dt * 0.14; f.x += f.vx * dt; f.y -= dt * f.s * 5;
    if (f.a <= 0) puffs.splice(i, 1);
  }
  flash = Math.max(0, flash - dt * 1.1);
  draw(P, T);
  drawStamp(P, T);
  requestAnimationFrame(frame);
}
sync();
requestAnimationFrame(frame);
window.__om = { run: s => { total = s * 1000; remaining = total; state = 'idle'; resetScene(); start(); } };
})();
</script>
